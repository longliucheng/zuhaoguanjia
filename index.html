<!DOCTYPE html>
<html lang="zh-CN">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>租号管家 - 账号监控面板</title>
   <style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }

       body {
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
           background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
           min-height: 100vh;
           padding: 20px;
           color: #333;
       }

       .container {
           max-width: 1200px;
           margin: 0 auto;
       }

       .header {
           text-align: center;
           margin-bottom: 30px;
           color: white;
       }

       .header h1 {
           font-size: 2.5em;
           margin-bottom: 10px;
           text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
       }

       .header p {
           opacity: 0.9;
           font-size: 1.1em;
       }

       .auth-section {
           background: rgba(255,255,255,0.95);
           border-radius: 20px;
           padding: 25px;
           margin-bottom: 25px;
           box-shadow: 0 20px 60px rgba(0,0,0,0.3);
           backdrop-filter: blur(10px);
       }

       .auth-header {
           display: flex;
           justify-content: space-between;
           align-items: center;
           margin-bottom: 20px;
           flex-wrap: wrap;
           gap: 10px;
       }

       .auth-header h2 {
           color: #667eea;
           font-size: 1.3em;
           display: flex;
           align-items: center;
           gap: 8px;
       }

       .auth-input-group {
           display: flex;
           gap: 10px;
           flex-wrap: wrap;
       }

       .auth-input {
           flex: 1;
           min-width: 300px;
           padding: 12px 16px;
           border: 2px solid #e0e0e0;
           border-radius: 12px;
           font-size: 14px;
           transition: all 0.3s;
           font-family: monospace;
       }

       .auth-input:focus {
           outline: none;
           border-color: #667eea;
           box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
       }

       .btn {
           padding: 12px 24px;
           border: none;
           border-radius: 12px;
           cursor: pointer;
           font-size: 14px;
           font-weight: 600;
           transition: all 0.3s;
           display: inline-flex;
           align-items: center;
           gap: 6px;
       }

       .btn-primary {
           background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
           color: white;
       }

       .btn-primary:hover {
           transform: translateY(-2px);
           box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
       }

       .btn-secondary {
           background: #f0f0f0;
           color: #666;
       }

       .btn-secondary:hover {
           background: #e0e0e0;
       }

       .btn-success {
           background: #10b981;
           color: white;
       }

       .btn-success:hover {
           background: #059669;
       }

       .btn-warning {
           background: #f59e0b;
           color: white;
       }

       .btn-warning:hover {
           background: #d97706;
       }

       .btn-info {
           background: #3b82f6;
           color: white;
       }

       .btn-info:hover {
           background: #2563eb;
       }

       .btn:disabled {
           opacity: 0.6;
           cursor: not-allowed;
           transform: none !important;
       }

       .history-section {
           margin-top: 20px;
           padding-top: 20px;
           border-top: 1px solid #eee;
       }

       .history-title {
           font-size: 0.9em;
           color: #666;
           margin-bottom: 10px;
           font-weight: 600;
       }

       .history-list {
           display: flex;
           flex-direction: column;
           gap: 8px;
       }

       .history-item {
           display: flex;
           align-items: center;
           gap: 10px;
           padding: 10px;
           background: #f8f9fa;
           border-radius: 8px;
           cursor: pointer;
           transition: all 0.2s;
           font-family: monospace;
           font-size: 12px;
           word-break: break-all;
       }

       .history-item:hover {
           background: #e9ecef;
           transform: translateX(5px);
       }

       .history-item.active {
           background: #667eea;
           color: white;
       }

       .history-time {
           font-size: 11px;
           opacity: 0.7;
           white-space: nowrap;
       }

       .stats-bar {
           display: grid;
           grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
           gap: 15px;
           margin-bottom: 25px;
       }

       .stat-card {
           background: rgba(255,255,255,0.95);
           padding: 20px;
           border-radius: 16px;
           box-shadow: 0 10px 40px rgba(0,0,0,0.1);
           text-align: center;
           transition: transform 0.3s;
       }

       .stat-card:hover {
           transform: translateY(-5px);
       }

       .stat-number {
           font-size: 2.5em;
           font-weight: bold;
           background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           background-clip: text;
       }

       .stat-label {
           color: #666;
           margin-top: 5px;
           font-size: 0.9em;
       }

       .accounts-grid {
           display: grid;
           grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
           gap: 20px;
       }

       .account-card {
           background: rgba(255,255,255,0.95);
           border-radius: 20px;
           padding: 25px;
           box-shadow: 0 10px 40px rgba(0,0,0,0.1);
           transition: all 0.3s;
           position: relative;
           overflow: hidden;
       }

       .account-card::before {
           content: '';
           position: absolute;
           top: 0;
           left: 0;
           width: 100%;
           height: 4px;
           background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
       }

       .account-card:hover {
           transform: translateY(-5px);
           box-shadow: 0 20px 60px rgba(0,0,0,0.15);
       }

       .account-card.busy::before {
           background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
       }

       .account-header {
           display: flex;
           justify-content: space-between;
           align-items: start;
           margin-bottom: 15px;
       }

       .game-name {
           font-size: 1.2em;
           font-weight: bold;
           color: #333;
           line-height: 1.3;
       }

       .platform-badge {
           display: inline-block;
           padding: 4px 12px;
           background: #667eea;
           color: white;
           border-radius: 20px;
           font-size: 0.75em;
           font-weight: 600;
           margin-top: 5px;
       }

       .status-badge {
           padding: 6px 14px;
           border-radius: 20px;
           font-size: 0.8em;
           font-weight: 600;
           display: flex;
           align-items: center;
           gap: 5px;
       }

       .status-busy {
           background: #fee;
           color: #c33;
       }

       .status-free {
           background: #efe;
           color: #3c3;
       }

       .quick-actions {
           display: flex;
           gap: 8px;
           margin-bottom: 15px;
           flex-wrap: wrap;
       }

       .quick-actions .btn {
           padding: 8px 16px;
           font-size: 12px;
           border-radius: 8px;
       }

       .account-body {
           margin: 15px 0;
       }

       .info-row {
           display: flex;
           justify-content: space-between;
           padding: 10px 0;
           border-bottom: 1px solid #f0f0f0;
           align-items: center;
       }

       .info-row:last-child {
           border-bottom: none;
       }

       .info-label {
           color: #666;
           font-size: 0.9em;
       }

       .info-value {
           font-family: monospace;
           font-weight: 600;
           color: #333;
           display: flex;
           align-items: center;
           gap: 8px;
       }

       .copy-btn {
           padding: 4px 8px;
           background: #f0f0f0;
           border: none;
           border-radius: 6px;
           cursor: pointer;
           font-size: 12px;
           transition: all 0.2s;
       }

       .copy-btn:hover {
           background: #667eea;
           color: white;
       }

       .code-btn {
           padding: 6px 12px;
           background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
           color: white;
           border: none;
           border-radius: 8px;
           cursor: pointer;
           font-size: 12px;
           font-weight: 600;
           transition: all 0.3s;
           display: inline-flex;
           align-items: center;
           gap: 4px;
       }

       .code-btn:hover {
           transform: scale(1.05);
           box-shadow: 0 5px 15px rgba(245, 87, 108, 0.3);
       }

       .code-btn:disabled {
           background: #ccc;
           transform: none;
           box-shadow: none;
       }

       .code-display {
           display: inline-flex;
           align-items: center;
           gap: 8px;
           padding: 6px 12px;
           background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
           color: white;
           border-radius: 8px;
           font-family: monospace;
           font-size: 1.1em;
           font-weight: bold;
           letter-spacing: 2px;
           animation: fadeIn 0.3s;
       }

       @keyframes fadeIn {
           from { opacity: 0; transform: scale(0.8); }
           to { opacity: 1; transform: scale(1); }
       }

       .countdown {
           font-size: 1.5em;
           font-weight: bold;
           color: #f5576c;
           text-align: center;
           padding: 15px;
           background: linear-gradient(135deg, #fff5f5 0%, #ffe0e0 100%);
           border-radius: 12px;
           margin-top: 15px;
           font-family: 'Courier New', monospace;
           letter-spacing: 2px;
       }

       .time-range {
           text-align: center;
           color: #666;
           font-size: 0.85em;
           margin-top: 8px;
       }

       .loading {
           text-align: center;
           padding: 60px;
           color: white;
       }

       .spinner {
           width: 50px;
           height: 50px;
           border: 4px solid rgba(255,255,255,0.3);
           border-top-color: white;
           border-radius: 50%;
           animation: spin 1s linear infinite;
           margin: 0 auto 20px;
       }

       @keyframes spin {
           to { transform: rotate(360deg); }
       }

       .error-message {
           background: rgba(255,255,255,0.95);
           color: #c33;
           padding: 20px;
           border-radius: 16px;
           text-align: center;
           margin: 20px 0;
       }

       .refresh-btn {
           position: fixed;
           bottom: 30px;
           right: 30px;
           width: 60px;
           height: 60px;
           border-radius: 50%;
           background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
           color: white;
           border: none;
           cursor: pointer;
           box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
           font-size: 24px;
           transition: all 0.3s;
           z-index: 1000;
       }

       .refresh-btn:hover {
           transform: scale(1.1) rotate(180deg);
       }

       .refresh-btn.spinning {
           animation: spin 1s linear infinite;
       }

       .toast {
           position: fixed;
           top: 20px;
           right: 20px;
           background: #333;
           color: white;
           padding: 16px 24px;
           border-radius: 12px;
           box-shadow: 0 10px 40px rgba(0,0,0,0.3);
           transform: translateX(400px);
           transition: transform 0.3s;
           z-index: 2000;
       }

       .toast.show {
           transform: translateX(0);
       }

       .empty-state {
           text-align: center;
           padding: 60px;
           color: white;
       }

       .empty-state svg {
           width: 100px;
           height: 100px;
           margin-bottom: 20px;
           opacity: 0.5;
       }

       .manual-refresh-notice {
           background: rgba(255,255,255,0.9);
           border-radius: 12px;
           padding: 15px;
           margin-bottom: 20px;
           text-align: center;
           color: #666;
           font-size: 0.9em;
           display: flex;
           align-items: center;
           justify-content: center;
           gap: 10px;
       }

       .modal-overlay {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background: rgba(0,0,0,0.5);
           display: flex;
           justify-content: center;
           align-items: center;
           z-index: 3000;
           opacity: 0;
           visibility: hidden;
           transition: all 0.3s;
       }

       .modal-overlay.show {
           opacity: 1;
           visibility: visible;
       }

       .modal {
           background: white;
           padding: 30px;
           border-radius: 20px;
           max-width: 400px;
           width: 90%;
           text-align: center;
           transform: scale(0.8);
           transition: transform 0.3s;
       }

       .modal-overlay.show .modal {
           transform: scale(1);
       }

       .modal h3 {
           margin-bottom: 15px;
           color: #333;
       }

       .modal-code {
           font-size: 3em;
           font-weight: bold;
           color: #667eea;
           letter-spacing: 8px;
           margin: 20px 0;
           font-family: monospace;
           background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
       }

       .modal-timer {
           color: #f5576c;
           font-size: 0.9em;
           margin-bottom: 20px;
       }

       .modal-buttons {
           display: flex;
           gap: 10px;
           justify-content: center;
       }

       @media (max-width: 768px) {
           .accounts-grid {
               grid-template-columns: 1fr;
           }
           
           .header h1 {
               font-size: 1.8em;
           }
           
           .auth-input {
               min-width: 100%;
           }
           
           .quick-actions {
               justify-content: stretch;
           }
           
           .quick-actions .btn {
               flex: 1;
               justify-content: center;
           }
       }
   </style>
</head>
<body>
   <div class="container">
       <div class="header">
           <h1>🎮 租号管家监控面板</h1>
           <p>手动刷新模式 | 一键复制账号密码 | 快速获取验证码</p>
       </div>

       <div class="auth-section">
           <div class="auth-header">
               <h2>
                   <span>🔐</span>
                   <span>Authorization 管理</span>
               </h2>
               <div>
                   <button class="btn btn-secondary" onclick="clearHistory()">清除历史</button>
               </div>
           </div>
           
           <div class="auth-input-group">
               <input type="text" 
                      class="auth-input" 
                      id="authInput" 
                      placeholder="输入 JWT Token (eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...)"
                      value="">
               <button class="btn btn-primary" onclick="saveAndFetch()">
                   <span>💾</span>
                   <span>保存并获取</span>
               </button>
               <button class="btn btn-success" onclick="fetchData()">
                   <span>🔄</span>
                   <span>刷新数据</span>
               </button>
           </div>

           <div class="history-section" id="historySection" style="display: none;">
               <div class="history-title">📜 历史记录（点击快速切换）</div>
               <div class="history-list" id="historyList"></div>
           </div>
       </div>

       <div id="content">
           <div class="empty-state">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                   <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                   <line x1="9" y1="9" x2="15" y2="15"></line>
                   <line x1="15" y1="9" x2="9" y2="15"></line>
               </svg>
               <h3>请输入 Authorization 开始</h3>
               <p>输入您的 JWT Token 后点击"保存并获取"</p>
           </div>
       </div>
   </div>

   <button class="refresh-btn" id="refreshBtn" onclick="fetchData()" title="手动刷新数据">
       ↻
   </button>

   <div class="toast" id="toast"></div>

   <div class="modal-overlay" id="codeModal" onclick="closeModal(event)">
       <div class="modal" onclick="event.stopPropagation()">
           <h3>🔢 账号验证码</h3>
           <div class="modal-code" id="modalCode">----</div>
           <div class="modal-timer" id="modalTimer">有效期：--:--</div>
           <p style="color: #666; font-size: 0.9em; margin-bottom: 20px;">
               如果验证码出错，请等待1分钟后重新获取
           </p>
           <div class="modal-buttons">
               <button class="btn btn-primary" onclick="copyModalCode()">复制验证码</button>
               <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
           </div>
       </div>
   </div>

   <script>
       const Storage = {
           get(key) {
               try {
                   return JSON.parse(localStorage.getItem(key));
               } catch {
                   return null;
               }
           },
           set(key, value) {
               localStorage.setItem(key, JSON.stringify(value));
           },
           remove(key) {
               localStorage.removeItem(key);
           }
       };

       let currentAuth = '';
       let countdownIntervals = [];
       let codeRefreshTimers = {};

       document.addEventListener('DOMContentLoaded', () => {
           loadHistory();
           const saved = Storage.get('currentAuth');
           if (saved) {
               document.getElementById('authInput').value = saved;
               currentAuth = saved;
               fetchData();
           }
       });

       function saveAndFetch() {
           const auth = document.getElementById('authInput').value.trim();
           if (!auth) {
               showToast('请输入 Authorization Token', 'error');
               return;
           }
           
           if (!auth.startsWith('eyJ')) {
               showToast('Token 格式似乎不正确，应以 eyJ 开头', 'warning');
           }
           
           saveToHistory(auth);
           currentAuth = auth;
           Storage.set('currentAuth', auth);
           fetchData();
       }

       function saveToHistory(auth) {
           let history = Storage.get('authHistory') || [];
           history = history.filter(item => item.token !== auth);
           history.unshift({
               token: auth,
               time: new Date().toLocaleString('zh-CN'),
               preview: auth.substring(0, 30) + '...'
           });
           history = history.slice(0, 10);
           Storage.set('authHistory', history);
           loadHistory();
       }

       function loadHistory() {
           const history = Storage.get('authHistory') || [];
           const section = document.getElementById('historySection');
           const list = document.getElementById('historyList');
           
           if (history.length === 0) {
               section.style.display = 'none';
               return;
           }
           
           section.style.display = 'block';
           list.innerHTML = history.map((item, index) => `
               <div class="history-item ${item.token === currentAuth ? 'active' : ''}" 
                    onclick="useHistory(${index})">
                   <span>${item.preview}</span>
                   <span class="history-time">${item.time}</span>
               </div>
           `).join('');
       }

       function useHistory(index) {
           const history = Storage.get('authHistory') || [];
           if (history[index]) {
               document.getElementById('authInput').value = history[index].token;
               currentAuth = history[index].token;
               Storage.set('currentAuth', currentAuth);
               loadHistory();
               fetchData();
               showToast('已切换至选中的 Token');
           }
       }

       function clearHistory() {
           if (confirm('确定要清除所有历史记录吗？')) {
               Storage.remove('authHistory');
               loadHistory();
               showToast('历史记录已清除');
           }
       }

       async function fetchData() {
           if (!currentAuth) {
               const input = document.getElementById('authInput').value.trim();
               if (!input) {
                   showToast('请先输入 Authorization', 'error');
                   return;
               }
               currentAuth = input;
               Storage.set('currentAuth', currentAuth);
               saveToHistory(currentAuth);
           }

           countdownIntervals.forEach(clearInterval);
           countdownIntervals = [];

           const btn = document.getElementById('refreshBtn');
           btn.classList.add('spinning');

           showLoading();

           try {
               const response = await fetch('https://www.zuhaoguanjia.com/api/web/rent_no/', {
                   method: 'POST',
                   headers: {
                       'Content-Type': 'application/json',
                       'Authorization': currentAuth,
                       'language': 'zh',
                       'accept-language': 'zh',
                       'user-agent': 'Mozilla/5.0 (Linux; Android 10; HarmonyOS; VOG-AL10) AppleWebKit/537.36',
                       'origin': 'https://www.zuhaoguanjia.com',
                       'referer': 'https://www.zuhaoguanjia.com/rendResult'
                   },
                   body: JSON.stringify({limit: 9999})
               });

               if (!response.ok) {
                   throw new Error(`HTTP ${response.status}: ${response.statusText}`);
               }

               const data = await response.json();
               
               if (data.status === 10000) {
                   renderData(data.data);
                   showToast(`成功获取 ${data.data.items.length} 个账号`);
               } else {
                   throw new Error(data.msg || '请求失败');
               }

           } catch (error) {
               console.error('Fetch error:', error);
               showError(error.message);
               
               if (confirm('请求失败，是否显示演示数据以查看界面效果？')) {
                   renderDemoData();
               }
           } finally {
               btn.classList.remove('spinning');
           }
       }

       // 一键复制账号+密码（Tab分隔，方便粘贴到两个输入框）
       function copyAccountTabPassword(account, password) {
           const text = `${account}\t${password}`;
           copyText(text);
           showToast('已复制：账号 + Tab + 密码');
       }

       // 一键复制账号+密码（换行格式）
       function copyAccountLinePassword(account, password) {
           const text = `${account}\n${password}`;
           copyText(text);
           showToast('已复制：账号 + 换行 + 密码');
       }

       // 一键复制账号+密码（JSON格式）
       function copyAccountJson(account, password) {
           const text = JSON.stringify({account: account, password: password}, null, 2);
           copyText(text);
           showToast('已复制 JSON 格式');
       }

       async function getVerificationCode(yzid, buttonElement) {
           if (!currentAuth) {
               showToast('请先登录', 'error');
               return;
           }

           const cooldownKey = `cooldown_${yzid}`;
           const cooldownEnd = Storage.get(cooldownKey);
           if (cooldownEnd && Date.now() < cooldownEnd) {
               const remaining = Math.ceil((cooldownEnd - Date.now()) / 1000);
               showToast(`请等待 ${remaining} 秒后重新获取`, 'warning');
               return;
           }

           const originalHTML = buttonElement.innerHTML;
           buttonElement.innerHTML = '<span class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin: 0;"></span>获取中...';
           buttonElement.disabled = true;

           try {
               const response = await fetch('https://www.zuhaoguanjia.com/api/web/account/yzma/', {
                   method: 'POST',
                   headers: {
                       'Content-Type': 'application/json',
                       'Authorization': currentAuth,
                       'language': 'zh',
                       'accept-language': 'zh',
                       'user-agent': 'Mozilla/5.0 (Linux; Android 10; HarmonyOS; VOG-AL10) AppleWebKit/537.36',
                       'origin': 'https://www.zuhaoguanjia.com',
                       'referer': 'https://www.zuhaoguanjia.com/rendResult',
                       'x-captcha-uuid': '522169cf-377a-40f9-aae6-d5dd9e4bc434'
                   },
                   body: JSON.stringify({yzid: yzid})
               });

               if (!response.ok) {
                   throw new Error(`HTTP ${response.status}`);
               }

               const data = await response.json();

               if (data.status === 10000) {
                   const code = data.data.verification_code;
                   
                   const displayElement = document.getElementById(`code-display-${yzid}`);
                   if (displayElement) {
                       displayElement.innerHTML = `
                           <span class="code-display">${code}</span>
                           <button class="copy-btn" onclick="copyText('${code}')">复制</button>
                       `;
                   }

                   showCodeModal(code);
                   showToast('验证码获取成功');

                   Storage.set(cooldownKey, Date.now() + 60000);
                   startCooldownTimer(yzid, buttonElement, 60);
               } else {
                   throw new Error(data.msg || '获取失败');
               }

           } catch (error) {
               console.error('Code fetch error:', error);
               showToast('获取验证码失败: ' + error.message, 'error');
               
               buttonElement.innerHTML = originalHTML;
               buttonElement.disabled = false;
           }
       }

       function startCooldownTimer(yzid, button, seconds) {
           let remaining = seconds;
           
           const updateButton = () => {
               if (remaining <= 0) {
                   button.innerHTML = '<span>🔄</span><span>获取验证码</span>';
                   button.disabled = false;
                   return;
               }
               button.innerHTML = `<span>⏱</span><span>${remaining}秒后重试</span>`;
               button.disabled = true;
               remaining--;
               setTimeout(updateButton, 1000);
           };
           
           updateButton();
       }

       function showCodeModal(code) {
           document.getElementById('modalCode').textContent = code;
           document.getElementById('codeModal').classList.add('show');
           
           let remaining = 60;
           const timerElement = document.getElementById('modalTimer');
           
           const updateTimer = () => {
               if (remaining <= 0) {
                   timerElement.textContent = '验证码已过期，请重新获取';
                   timerElement.style.color = '#f5576c';
                   return;
               }
               timerElement.textContent = `有效期：${String(Math.floor(remaining / 60)).padStart(2, '0')}:${String(remaining % 60).padStart(2, '0')}`;
               remaining--;
               codeRefreshTimers.modal = setTimeout(updateTimer, 1000);
           };
           
           clearTimeout(codeRefreshTimers.modal);
           updateTimer();
       }

       function closeModal(event) {
           if (!event || event.target.id === 'codeModal') {
               document.getElementById('codeModal').classList.remove('show');
               clearTimeout(codeRefreshTimers.modal);
           }
       }

       function copyModalCode() {
           const code = document.getElementById('modalCode').textContent;
           copyText(code);
       }

                               <span>复制账号+密码(Tab)</span>
                           </button>
                           <button class="btn btn-info" onclick="copyAccountLinePassword('${escapedAccount}', '${escapedPassword}')" title="复制账号+换行+密码">
                               <span>📄</span>
                               <span>复制账号+密码(换行)</span>
                           </button>
                           <button class="btn btn-secondary" onclick="copyAccountJson('${escapedAccount}', '${escapedPassword}')" title="复制JSON格式">
                               <span>{}</span>
                               <span>JSON格式</span>
                           </button>
                       </div>
                       
                       <div class="account-body">
                           <div class="info-row">
                               <span class="info-label">账号 ID</span>
                               <span class="info-value">#${item.id}</span>
                           </div>
                           <div class="info-row">
                               <span class="info-label">英文名称</span>
                               <span class="info-value">${escapeHtml(item.ename)}</span>
                           </div>
                           <div class="info-row">
                               <span class="info-label">登录账号</span>
                               <span class="info-value">
                                   ${escapeHtml(item.saccount)}
                                   <button class="copy-btn" onclick="copyText('${escapedAccount}')">复制</button>
                               </span>
                           </div>
                           <div class="info-row">
                               <span class="info-label">登录密码</span>
                               <span class="info-value">
                                   ${escapeHtml(item.spassword)}
                                   <button class="copy-btn" onclick="copyText('${escapedPassword}')">复制</button>
                               </span>
                           </div>
                           <div class="info-row">
                               <span class="info-label">CDKEY</span>
                               <span class="info-value">
                                   ${escapeHtml(item.cdkey)}
                                   <button class="copy-btn" onclick="copyText('${escapeHtml(item.cdkey)}')">复制</button>
                               </span>
                           </div>
                           <div class="info-row">
                               <span class="info-label">验证码</span>
                               <span class="info-value" id="code-display-${item.id}">
                                   <button class="code-btn" onclick="getVerificationCode(${item.id}, this)">
                                       <span>🔄</span>
                                       <span>获取验证码</span>
                                   </button>
                               </span>
                           </div>
                       </div>

                       <div class="countdown" id="countdown-${item.id}">
                           ${isExpired ? '已到期' : calculateRemaining(endTime)}
                       </div>
                       <div class="time-range">
                           ${formatTime(item.stime)} ~ ${formatTime(item.etime)}
                       </div>
                   </div>
               `;
           }).join('');

           document.getElementById('content').innerHTML = statsHtml + 
               '<div class="accounts-grid">' + accountsHtml + '</div>';

           data.items.forEach(item => {
               const endTime = new Date(item.etime);
               if (endTime > now) {
                   startCountdown(item.id, endTime);
               }
           });
       }

       function startCountdown(id, endTime) {
           const element = document.getElementById(`countdown-${id}`);
           if (!element) return;

           const update = () => {
               const remaining = endTime - new Date();
               if (remaining <= 0) {
                   element.textContent = '已到期';
                   element.style.background = '#fee';
                   element.style.color = '#c33';
                   clearInterval(interval);
                   return;
               }
               element.textContent = calculateRemaining(endTime);
           };

           update();
           const interval = setInterval(update, 1000);
           countdownIntervals.push(interval);
       }

       function calculateRemaining(endTime) {
           const diff = endTime - new Date();
           if (diff <= 0) return '00:00:00';
           
           const hours = Math.floor(diff / 3600000);
           const minutes = Math.floor((diff % 3600000) / 60000);
           const seconds = Math.floor((diff % 60000) / 1000);
           
           return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
       }

       function formatTime(timeStr) {
           const date = new Date(timeStr);
           return date.toLocaleString('zh-CN', {
               month: 'short',
               day: 'numeric',
               hour: '2-digit',
               minute: '2-digit'
           });
       }

       function copyText(text) {
           navigator.clipboard.writeText(text).then(() => {
               showToast('已复制到剪贴板');
           }).catch(() => {
               const input = document.createElement('input');
               input.value = text;
               document.body.appendChild(input);
               input.select();
               document.execCommand('copy');
               document.body.removeChild(input);
               showToast('已复制到剪贴板');
           });
       }

       function showToast(message, type = 'success') {
           const toast = document.getElementById('toast');
           toast.textContent = message;
           toast.style.background = type === 'error' ? '#c33' : type === 'warning' ? '#f59e0b' : '#333';
           toast.classList.add('show');
           
           setTimeout(() => {
               toast.classList.remove('show');
           }, 3000);
       }

       function escapeHtml(text) {
           const div = document.createElement('div');
           div.textContent = text;
           return div.innerHTML;
       }
